# Публикует папку web_app в ветку gh-pages (оттуда работает GitHub Pages)
# после каждого мержа в main, который меняет Mini App.
name: Deploy Mini App

on:
  push:
    branches: [main]
    paths: ['web_app/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web_app
